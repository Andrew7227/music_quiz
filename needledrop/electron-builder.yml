appId: app.needledrop.desktop
productName: Needledrop
copyright: Copyright © 2026 Andryha
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  artifactName: Needledrop-Setup-${version}.${ext}
portable:
  artifactName: Needledrop-${version}-portable.${ext}
publish:
  - provider: github
    releaseType: release
